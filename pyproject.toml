[project]
name = "peyk"
version = "0.1.0"
description = "A vim-style Telegram client for the Windows terminal"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "telethon>=1.46,<1.47",
  "cryptg>=0.6",
  "textual>=8.2,<9",
  "textual-image[textual]>=0.14,<0.15",
  "python-bidi>=0.6.12,<0.7",
  "arabic-reshaper>=3.1,<4",
  "python-socks[asyncio]>=3.2",
  "rapidfuzz>=3.14",
  "windows-toasts>=1.3.1; sys_platform == 'win32'",
  "platformdirs>=4",
  "sounddevice>=0.5",
  "soundfile>=0.13",
]

[project.scripts]
peyk = "peyk.__main__:main"

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.5", "pytest-textual-snapshot>=1.1", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peyk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
